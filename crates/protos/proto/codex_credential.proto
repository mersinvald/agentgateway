syntax = "proto3";

package agentgateway.dev.credential;

option go_package = "github.com/agentgateway/agentgateway/go/api;api";

// CodexCredentialService persists one shared OAuth credential for the caller's
// Kubernetes namespace. The authenticated server derives that namespace; clients
// cannot select another namespace.
service CodexCredentialService {
  rpc Load(CodexCredentialLoadRequest) returns (CodexCredentialLoadResponse);
  rpc Replace(CodexCredentialReplaceRequest) returns (CodexCredentialReplaceResponse);
}

message CodexCredentialLoadRequest {}

message CodexCredentialLoadResponse {
  // Opaque credential bytes. This field is sensitive and must never be logged.
  bytes credential = 1;
  // Kubernetes resource version used as the compare-and-swap generation.
  string generation = 2;
}

message CodexCredentialReplaceRequest {
  // The generation returned by Load. Empty only creates an absent credential.
  string expected_generation = 1;
  // Opaque credential bytes. This field is sensitive and must never be logged.
  bytes credential = 2;
}

message CodexCredentialReplaceResponse {
  string generation = 1;
}
